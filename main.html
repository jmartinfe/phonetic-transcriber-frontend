<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transcribe Spanish text into phonetic pronunciation with IPA and alternative pronunciations.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#eef3f8">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="194x194" href="img/favicon-194x194.png">
  <link rel="shortcut icon" href="img/favicon.ico">
  <title>Transcriptor Fonético</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <h2>Transcriptor Fonético</h2>
  </header>
  <form id="transcriberForm">
    <label for="phrase">Introduce una palabra o frase (hasta 2000 caracteres):</label>
    <textarea id="phrase" maxlength="2000" placeholder="Escribe el texto aquí..."></textarea>
    <div id="controls" class="button-row">
      <button type="submit">Transcribir</button>
      <button type="button" id="notesToggle" class="toggle-button">Mostrar notas</button>
    </div>
  </form>
  <div id="output" aria-live="polite">La transcripción aparecerá aquí.</div>
  <ul id="outputList" aria-live="polite"></ul>
  <div id="wordTooltip" class="tooltip" aria-hidden="true"></div>
  <script src="js/app.js"></script>
</body>
</html>
